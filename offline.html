<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hors ligne</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f9;
            color: #333;
            padding-top: 100px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #d9534f;
        }

        button {
            background-color: #0275d8;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 20px;
        }

        button:hover {
            background-color: #025aa5;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Oups ! Vous êtes hors ligne</h1>
        <p>Il semble que votre connexion Internet soit interrompue.</p>
        <p>Veuillez vérifier votre réseau et réessayer.</p>
        <button onclick="window.location.reload()">Réessayer</button>
    </div>

    <script>
        // Recharge la page dès que la connexion revient
        window.addEventListener('online', () => {
            window.location.reload();
        });
    </script>
</body>

</html>
